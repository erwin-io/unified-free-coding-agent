name: python-validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q router automation
      - name: Unit tests (all four stack templates and safe scaffold)
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Demo app tests
        working-directory: examples/test-nodejs-web-app
        run: npm test
      - name: Demo app syntax checks
        working-directory: examples/test-nodejs-web-app
        run: npm run lint
      - name: Free capacity OpenCode plugin syntax
        run: node --check .opencode/plugins/unified-free-capacity-retry/index.js
      - name: Simulated OpenCode retry decisions
        run: node --test tests/opencode-retry.test.mjs
      - name: PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./run.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw (($errors | ForEach-Object { "Line=$($_.Extent.StartLineNumber) Column=$($_.Extent.StartColumnNumber) Error=$($_.Message)" }) -join "; ") }
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./scripts/app-control.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./scripts/github-access.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Windows bootstrap and interrupted-copy recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1
      - name: Windows Node server launch and port conflict recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-node-demo-launch.ps1
