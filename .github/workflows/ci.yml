name: python-validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q router automation
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Demo app tests
        working-directory: examples/test-nodejs-web-app
        run: npm test
      - name: Demo app syntax checks
        working-directory: examples/test-nodejs-web-app
        run: npm run lint
